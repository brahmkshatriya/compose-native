def usesOfficialComposeDependencies = providers.gradleProperty("compose.platforms").getOrElse("") == "Desktop"
def upstreamComposeVersion = providers.gradleProperty("compose.native.upstream.version.COMPOSE").get()
def upstreamMaterial3Version = providers.gradleProperty("compose.native.upstream.version.COMPOSE_MATERIAL3").get()
def composeDependency = { String projectPath ->
    if (!usesOfficialComposeDependencies) return project(projectPath)
    def parts = projectPath.tokenize(":")
    if (parts.size() < 3 || parts[0] != "compose") {
        throw new GradleException("Unsupported Compose project dependency: $projectPath")
    }
    def family = parts[1]
    def module = parts[-1]
    def version = family == "material3" ? upstreamMaterial3Version : upstreamComposeVersion
    return "org.jetbrains.compose.$family:$module:$version"
}


