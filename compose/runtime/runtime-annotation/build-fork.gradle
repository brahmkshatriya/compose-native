import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    redirect("androidx.compose.runtime") {
        androidLibrary {
            namespace = "org.jetbrains.compose.runtime.annotation"
        }
        jvm()
        macosArm64()
        linux()
        mingwX64()
        ios()
        watchos()
        tvos()
        js()
        wasmJs()
    }

    // Google no longer publishes this artifact for Intel macOS.
    macosX64()

    defaultPlatform(PlatformIdentifier.JVM)
}

androidx {
    name = "Compose Runtime Annotation"
    type = SoftwareType.PUBLISHED_LIBRARY
    inceptionYear = "2025"
    description = "Provides Compose-specific annotations used by the compiler and tooling"
}
