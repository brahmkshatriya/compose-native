import androidx.build.PlatformIdentifier
import androidx.build.SoftwareType
plugins {
    id("AndroidXPlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    redirect("androidx.navigationevent") {
        androidLibrary {
            compileSdk = 36
            namespace = "org.jetbrains.androidx.navigationevent"
            androidResources.enable = true
        }
        desktop()
        macosArm64()
        linux()
        ios()
        watchos()
        tvos()
        mingwX64()
        js()
        wasmJs()
    }

    // AndroidX no longer publishes NavigationEvent for Intel macOS.
    macosX64()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        configureEach {
            languageSettings.optIn("kotlin.contracts.ExperimentalContracts")
        }

        commonMain.dependencies {
            implementation(libs.kotlinCoroutinesCore)
            api("androidx.annotation:annotation:1.9.1")
            api("androidx.compose.runtime:runtime-annotation:1.9.0")
            implementation("androidx.collection:collection:1.5.0")
        }

        androidMain.dependencies {
            implementation(libs.kotlinCoroutinesAndroid)
            implementation("androidx.core:core-viewtree:1.0.0")
        }

        nativeMain.dependencies {
            implementation(libs.atomicFu)
        }

        wasmJsMain.dependencies {
            implementation(libs.kotlinXw3c)
        }
    }
}

androidx {
    name = "Navigation Event"
    type = SoftwareType.PUBLISHED_LIBRARY
    inceptionYear = "2025"
    description = "Provides APIs to easily intercept platform navigation events, including " +
            "swipes and clicks, to provide a consistent API surface for handling these events."
}
