import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("JetBrainsAndroidXPlugin")
    alias(libs.plugins.kotlinSerialization)
}

androidXMultiplatform {
    redirect("androidx.savedstate") {
        androidLibrary {
            namespace = "org.jetbrains.savedstate"
            optimization {
                it.consumerKeepRules.publish = true
                it.consumerKeepRules.files.add(new File("proguard-rules.pro"))
            }
            androidResources.enable = true
        }
        desktop()
        macosArm64()
        linux()
        ios()
        watchos()
        tvos()
        mingwX64()
        js()
        wasmJs()
    }

    // AndroidX no longer publishes the Intel macOS variant. Build it from the
    // current in-tree SavedState sources so nullable serialization APIs stay
    // in sync with their consumers.
    macosX64()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        // jbVerifyForkDependencies: suppress
        commonMain {
            dependencies {
                api("androidx.annotation:annotation:1.9.1")
                implementation(project(":lifecycle:lifecycle-common"))
                implementation("androidx.collection:collection:1.5.0")
                api(libs.kotlinCoroutinesCore)
                api(libs.kotlinSerializationCore)
            }
        }

        create("nonAndroidMain").dependsOn(commonMain)
        nonJvmMain.dependsOn(nonAndroidMain)
        desktopMain.dependsOn(nonAndroidMain)

        nativeMain.dependencies {
            implementation(libs.atomicFu)
        }
    }
}

androidx {
    name = "Saved State"
    type = SoftwareType.PUBLISHED_LIBRARY
    inceptionYear = "2018"
    description = "Android Lifecycle Saved State"
}
