name: Publish Compose Native to Maven Central

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

concurrency:
  group: publish-compose-native-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Match tag to the publication contract
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Tag must be a Maven version such as 1.12.10-alpha05 or v1.12.10-alpha05" >&2
            exit 1
          fi
          contract_version="$(sed -n 's/^jetbrains.publication.version.COMPOSE=//p' gradle.properties | tail -n1)"
          plugin_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' gradle-plugin/build.gradle.kts | head -n1)"
          if [[ "$version" != "$contract_version" ]]; then
            echo "Tag $version does not match Compose $contract_version and plugin $plugin_version" >&2
            exit 1
          fi
          if [[ "$version" != "$plugin_version" ]]; then
            echo "Tag $version does not match Compose $contract_version and plugin $plugin_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  native:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            id: linux-x64
            runner: ubuntu-24.04
            platform: LinuxX64
          - name: Linux arm64
            id: linux-arm64
            runner: ubuntu-24.04
            platform: LinuxArm64
          - name: Windows x64
            id: windows-x64
            runner: windows-2022
            platform: MingwX64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Export AndroidX JDK location
        shell: bash
        run: echo "ANDROIDX_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Install Linux native headers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libgl-dev \
            libpng-dev \
            libwayland-dev \
            libx11-dev \
            pkg-config \
            zlib1g-dev
          sdl_archive="$RUNNER_TEMP/SDL3-3.4.10.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$sdl_archive" \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-3.4.10.tar.gz
          echo '12b34280415ec8418c864408b93d008a20a6530687ee613d60bfbd20411f2785  '"$sdl_archive" | sha256sum --check
          tar --extract --gzip --file "$sdl_archive" --directory "$RUNNER_TEMP"
          sudo cp --recursive "$RUNNER_TEMP/SDL3-3.4.10/include/SDL3" /usr/include/
          dbus_arch_include="$(pkg-config --variable=libdir dbus-1)/dbus-1.0/include"
          sudo mkdir --parents /usr/lib/dbus-1.0
          if [[ ! -e /usr/lib/dbus-1.0/include ]]; then
            sudo ln --symbolic "$dbus_arch_include" /usr/lib/dbus-1.0/include
          fi

      - name: Publish target to an isolated Maven repository
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          COMPOSE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/release/maven-local"
          gradle_command='./gradlew'
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            gradle_command='./gradlew.bat'
          fi
          publication_tasks=(':mpp:publishComposeNativeToMavenLocal')
          if [[ "$COMPOSE_PLATFORM" == 'LinuxX64' ]]; then
            publication_tasks+=(':mpp:publishComposeForkRootsToMavenLocal')
          fi
          "$gradle_command" \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache \
            --no-configure-on-demand \
            "-Dmaven.repo.local=$repository" \
            "-Pcompose.platforms=$COMPOSE_PLATFORM" \
            -Pjetbrains.publication.groupPrefix=dev.brahmkshatriya \
            "-Pjetbrains.publication.version.COMPOSE=$RELEASE_VERSION" \
            "-Pjetbrains.publication.version.COMPOSE_MATERIAL3=$RELEASE_VERSION" \
            "-Pjetbrains.publication.version.NAVIGATION_EVENT=$RELEASE_VERSION" \
            "-Pjetbrains.publication.version.LIFECYCLE=$RELEASE_VERSION" \
            "-Pjetbrains.publication.version.SAVEDSTATE=$RELEASE_VERSION" \
            "${publication_tasks[@]}"

      - name: Export only fork publications
        shell: bash
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/release/maven-local/dev/brahmkshatriya"
          export_root="$GITHUB_WORKSPACE/release/export/dev/brahmkshatriya"
          mkdir -p "$export_root"
          for namespace in compose androidx; do
            if [[ -d "$repository/$namespace" ]]; then
              cp -R "$repository/$namespace" "$export_root/"
            fi
          done
          test -d "$export_root/compose"

      - uses: actions/upload-artifact@v4
        name: Upload ${{ matrix.name }} repository
        with:
          name: compose-native-repo-${{ matrix.id }}-${{ needs.prepare.outputs.version }}
          path: release/export
          if-no-files-found: error
          retention-days: 5

  android-web:
    name: Build Android, JS, and Wasm
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        name: Set up Android SDK

      - name: Install Android platform and export JDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          echo "ANDROIDX_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Publish fork platforms to an isolated Maven repository
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/release/maven-local"
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache \
            --no-configure-on-demand \
            "-Dmaven.repo.local=$repository" \
            -Pcompose.platforms=Android,Js,WasmJs \
            -Pjetbrains.publication.groupPrefix=dev.brahmkshatriya \
            "-Pjetbrains.publication.version.COMPOSE=$RELEASE_VERSION" \
            "-Pjetbrains.publication.version.COMPOSE_MATERIAL3=$RELEASE_VERSION" \
            :mpp:publishComposeForkPlatformsToMavenLocal

          scripts/verify-fork-android-aars.py \
            --repository "$repository" \
            --version "$RELEASE_VERSION" \
            --group-prefix dev.brahmkshatriya

      - name: Export only fork publications
        shell: bash
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/release/maven-local/dev/brahmkshatriya"
          export_root="$GITHUB_WORKSPACE/release/export/dev/brahmkshatriya"
          mkdir -p "$export_root"
          for namespace in compose androidx; do
            if [[ -d "$repository/$namespace" ]]; then
              cp -R "$repository/$namespace" "$export_root/"
            fi
          done
          test -d "$export_root/compose"

      - uses: actions/upload-artifact@v4
        name: Upload Android and web repository
        with:
          name: compose-native-repo-android-web-${{ needs.prepare.outputs.version }}
          path: release/export
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Sign and publish one Central deployment
    needs:
      - prepare
      - native
      - android-web
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        name: Set up JDK 21
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        name: Merge platform Maven repositories
        with:
          pattern: compose-native-repo-*-${{ needs.prepare.outputs.version }}
          path: release/merged-repository
          merge-multiple: true

      - name: Restore Gradle properties and signing key
        shell: bash
        env:
          GRADLE_PROPERTIES_CONTENT: ${{ secrets.GRADLE_PROPERTIES }}
          GPG_SECRET_KEY_RING_BASE64: ${{ secrets.GPG_SECRET_KEY_RING_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PROPERTIES_CONTENT"
          test -n "$GPG_SECRET_KEY_RING_BASE64"
          gradle_dir="$HOME/.gradle"
          properties_file="$gradle_dir/gradle.properties"
          keyring="$gradle_dir/compose-native-secret-key.gpg"
          mkdir -p "$gradle_dir"
          printf '%s' "$GRADLE_PROPERTIES_CONTENT" > "$properties_file"
          printf '%s' "$GPG_SECRET_KEY_RING_BASE64" | tr -d '\r\n ' | base64 --decode > "$keyring"
          test -s "$keyring"
          awk '!/^signing.secretKeyRingFile=/' "$properties_file" > "$properties_file.tmp"
          mv "$properties_file.tmp" "$properties_file"
          printf '\nsigning.secretKeyRingFile=%s\n' "$keyring" >> "$properties_file"
          chmod 600 "$properties_file" "$keyring"

      - name: Generate aggregate KMP roots
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          upstream_compose="$(sed -n 's/^compose.native.upstream.version.COMPOSE=//p' gradle.properties | tail -n1)"
          upstream_material3="$(sed -n 's/^compose.native.upstream.version.COMPOSE_MATERIAL3=//p' gradle.properties | tail -n1)"
          upstream_lifecycle="$(sed -n 's/^compose.native.upstream.version.LIFECYCLE=//p' gradle.properties | tail -n1)"
          upstream_navigation3="$(sed -n 's/^compose.native.upstream.version.NAVIGATION_3=//p' gradle.properties | tail -n1)"
          upstream_navigationevent="$(sed -n 's/^compose.native.upstream.version.NAVIGATION_EVENT=//p' gradle.properties | tail -n1)"
          upstream_savedstate="$(sed -n 's/^compose.native.upstream.version.SAVEDSTATE=//p' gradle.properties | tail -n1)"
          native_skiko_group="$(sed -n 's/^compose.native.skiko.group=//p' gradle.properties | tail -n1)"
          native_skiko_version="$(sed -n 's/^compose.native.skiko.version=//p' gradle.properties | tail -n1)"
          python3 scripts/write-linux-native-root-metadata.py \
            --repository release/merged-repository \
            --version "$RELEASE_VERSION" \
            --group-prefix dev.brahmkshatriya \
            --upstream-compose-version "$upstream_compose" \
            --upstream-material3-version "$upstream_material3" \
            --upstream-lifecycle-version "$upstream_lifecycle" \
            --upstream-navigation3-version "$upstream_navigation3" \
            --upstream-navigationevent-version "$upstream_navigationevent" \
            --upstream-savedstate-version "$upstream_savedstate" \
            --native-skiko-group "$native_skiko_group" \
            --native-skiko-version "$native_skiko_version" \
            --all-platforms

      - name: Publish Gradle plugin into the merged repository
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          echo "ANDROIDX_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"
          ./gradlew \
            -p gradle-plugin \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache \
            "-Dmaven.repo.local=$GITHUB_WORKSPACE/release/merged-repository" \
            publishToMavenLocal

      - name: Verify merged platform set
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          group_root='release/merged-repository/dev/brahmkshatriya'
          native_skiko_group="$(sed -n 's/^compose.native.skiko.group=//p' gradle.properties | tail -n1)"
          native_skiko_version="$(sed -n 's/^compose.native.skiko.version=//p' gradle.properties | tail -n1)"
          ui_root="$group_root/compose/ui/ui/$RELEASE_VERSION/ui-$RELEASE_VERSION.module"
          test -s "$ui_root"
          test -s "$group_root/compose/ui/ui/$RELEASE_VERSION/ui-$RELEASE_VERSION.jar"
          jq -e '.variants[] | select(.name == "metadataApiElements")' "$ui_root" >/dev/null
          desktop_root="$group_root/compose/desktop/desktop-native/$RELEASE_VERSION/desktop-native-$RELEASE_VERSION.module"
          desktop_metadata="$group_root/compose/desktop/desktop-native/$RELEASE_VERSION/desktop-native-$RELEASE_VERSION.jar"
          test -s "$desktop_root"
          test -s "$desktop_metadata"
          jq -e '.variants[] | select(.name == "metadataApiElements")' "$desktop_root" >/dev/null
          unzip -l "$desktop_metadata" > "$RUNNER_TEMP/desktop-native-metadata-list.txt"
          grep -q 'desktopNativeMain/default/linkdata/package_androidx.compose.ui.window/' "$RUNNER_TEMP/desktop-native-metadata-list.txt"
          grep -q 'desktopNativeMain-cinterop/.*/default/manifest' "$RUNNER_TEMP/desktop-native-metadata-list.txt"
          grep -q 'desktopNativeMain-cinterop/.*cinterop-sdl3/default/linkdata/module' "$RUNNER_TEMP/desktop-native-metadata-list.txt"
          grep -q 'desktopNativeMain-cinterop/.*cinterop-nativeDesktop/default/linkdata/module' "$RUNNER_TEMP/desktop-native-metadata-list.txt"
          unzip -p "$desktop_metadata" desktopNativeMain/default/manifest > "$RUNNER_TEMP/desktop-native-manifest.txt"
          grep -q '^commonizer_native_targets=linux_arm64 linux_x64 mingw_x64$' "$RUNNER_TEMP/desktop-native-manifest.txt"
          grep -q '^commonizer_target=(linux_arm64, linux_x64, mingw_x64)$' "$RUNNER_TEMP/desktop-native-manifest.txt"
          grep -q '^native_targets=linux_arm64 linux_x64 mingw_x64$' "$RUNNER_TEMP/desktop-native-manifest.txt"
          unzip -p "$desktop_metadata" 'desktopNativeMain-cinterop/*/default/manifest' > "$RUNNER_TEMP/desktop-native-cinterop-manifests.txt"
          test "$(grep -c '^commonizer_native_targets=linux_arm64 linux_x64 mingw_x64$' "$RUNNER_TEMP/desktop-native-cinterop-manifests.txt")" -eq 2
          test "$(grep -c '^commonizer_target=(linux_arm64, linux_x64, mingw_x64)$' "$RUNNER_TEMP/desktop-native-cinterop-manifests.txt")" -eq 2
          expected_targets=$'linux_arm64\nlinux_x64\nmingw_x64'
          actual_targets="$(jq -r '.variants[].attributes["org.jetbrains.kotlin.native.target"] // empty' "$ui_root" | sort -u)"
          test "$actual_targets" = "$expected_targets"
          for module in ui-linuxx64 ui-linuxarm64 ui-mingwx64; do
            test -d "$group_root/compose/ui/$module/$RELEASE_VERSION"
          done
          for module in foundation-android foundation-js foundation-wasm-js; do
            test -d "$group_root/compose/foundation/$module/$RELEASE_VERSION"
          done
          for module in material3-android material3-js material3-wasm-js; do
            test -d "$group_root/compose/material3/$module/$RELEASE_VERSION"
          done
          native_skiko_dependencies=0
          while IFS= read -r -d '' module_file; do
            if jq -e --arg group "$native_skiko_group" --arg version "$native_skiko_version" '
              .variants[] |
              (.dependencies[]?, .dependencyConstraints[]?) |
              select(.module == "skiko") |
              select(
                .group != $group or
                (
                  [.version.requires?, .version.strictly?, .version.prefers?] |
                  map(select(. != null)) |
                  length == 0 or any(. != $version)
                )
              )
            ' "$module_file" >/dev/null; then
              echo "Incorrect native Skiko dependency in $module_file" >&2
              exit 1
            fi
            if jq -e --arg group "$native_skiko_group" '
              .variants[] |
              (.dependencies[]?, .dependencyConstraints[]?) |
              select(.group == $group and .module == "skiko")
            ' "$module_file" >/dev/null; then
              native_skiko_dependencies=$((native_skiko_dependencies + 1))
            fi
          done < <(
            find "$group_root" \
              \( -path "*-linuxx64/$RELEASE_VERSION/*.module" \
              -o -path "*-linuxarm64/$RELEASE_VERSION/*.module" \
              -o -path "*-mingwx64/$RELEASE_VERSION/*.module" \) \
              -print0
          )
          test "$native_skiko_dependencies" -gt 0
          while IFS= read -r -d '' module_file; do
            if jq -e --arg release "$RELEASE_VERSION" '
              .variants[] |
              (.dependencies[]?, .dependencyConstraints[]?) |
              select(
                ((.group // "") | startswith("dev.brahmkshatriya.compose.") or
                  startswith("dev.brahmkshatriya.androidx.")) or
                (
                  ((.group // "") | startswith("org.jetbrains.compose.") or
                    startswith("org.jetbrains.androidx.")) and
                  ([.version.requires?, .version.strictly?, .version.prefers?] | index($release))
                )
              )
            ' "$module_file" >/dev/null; then
              echo "Fork-internal dependency coordinate leaked into $module_file" >&2
              exit 1
            fi
          done < <(find "$group_root" -path "*/$RELEASE_VERSION/*.module" -print0)
          plugin_dir="$group_root/compose/compose-gradle-plugin/$RELEASE_VERSION"
          marker_dir="$group_root/compose/dev.brahmkshatriya.compose.gradle.plugin/$RELEASE_VERSION"
          test -s "$plugin_dir/compose-gradle-plugin-$RELEASE_VERSION.jar"
          test -s "$marker_dir/dev.brahmkshatriya.compose.gradle.plugin-$RELEASE_VERSION.pom"

      - name: Upload Central bundle for automatic publication
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/publish-maven-central-bundle.sh \
            "$GITHUB_WORKSPACE/release/merged-repository" \
            "$RELEASE_VERSION" \
            "$GITHUB_WORKSPACE/release/compose-native-$RELEASE_VERSION.zip"

      - uses: actions/upload-artifact@v4
        if: failure()
        name: Preserve failed Central bundle
        with:
          name: failed-compose-native-central-bundle-${{ needs.prepare.outputs.version }}
          path: release/compose-native-${{ needs.prepare.outputs.version }}.zip
          if-no-files-found: ignore
          retention-days: 5
