import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    redirect("androidx.lifecycle") {
        androidLibrary {
            namespace = "org.jetbrains.lifecycle.runtime"
            withJava()
            androidResources.enable = true
        }
        desktop()
        macosArm64()
        linux()
        ios()
        watchos()
        tvos()
        mingwX64()
        js()
        wasmJs()
    }

    // AndroidX no longer publishes a usable Intel macOS runtime for this fork graph.
    // Build it from the same in-tree sources as the other source-built lifecycle modules.
    macosX64()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        configureEach {
            languageSettings.optIn("kotlin.experimental.ExperimentalNativeApi")
        }

        // jbVerifyForkDependencies: suppress
        commonMain {
            dependencies {
                api(project(":lifecycle:lifecycle-common"))
                api("androidx.annotation:annotation:1.9.1")
                implementation("androidx.collection:collection:1.5.0")
            }
        }
    }
}

androidx {
    name = "Lifecycle Runtime"
    type = SoftwareType.PUBLISHED_LIBRARY
    inceptionYear = "2017"
    description = "Android Lifecycle Runtime"
}
