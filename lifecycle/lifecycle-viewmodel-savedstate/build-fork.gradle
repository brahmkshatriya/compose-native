import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("JetBrainsAndroidXPlugin")
    alias(libs.plugins.kotlinSerialization)
}


androidXMultiplatform {
    redirect("androidx.lifecycle") {
        androidLibrary {
            namespace = "org.jetbrains.lifecycle.viewmodel.savedstate"
        }
        desktop()
        macosArm64()
        linux()
        ios()
        watchos()
        tvos()
        mingwX64()
        js()
        wasmJs()
    }

    // Google no longer publishes these redirect artifacts for Intel macOS.
    // Build macosX64 from the in-tree sources while retaining redirects elsewhere.
    macosX64()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        // jbVerifyForkDependencies: suppress
        commonMain {
            dependencies {
                api("androidx.annotation:annotation:1.9.1")
                api(project(":savedstate:savedstate"))
                implementation(project(":lifecycle:lifecycle-common"))
                api(project(":lifecycle:lifecycle-viewmodel"))
                implementation("androidx.collection:collection:1.5.0")
                api(libs.kotlinCoroutinesCore)
                api(libs.kotlinSerializationCore)
            }
        }

        create("nonAndroidMain").dependsOn(commonMain)
        desktopMain.dependsOn(nonAndroidMain)
        nonJvmMain.dependsOn(nonAndroidMain)
    }
}

androidx {
    name = "Lifecycle ViewModel with SavedState"
    type = SoftwareType.PUBLISHED_LIBRARY
    inceptionYear = "2018"
    description = "Android Lifecycle ViewModel"
}
